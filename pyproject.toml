[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hatelens"
version = "0.1.0"
description = "Explainable hate speech detection, bias auditing, and reviewed human feedback with traditional NLP."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "yt-dlp>=2025.10.22",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
hatelens = "hatelens.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["hatelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
